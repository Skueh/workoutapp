<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<title>Treino</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#111;--mu:#777;--ac:#ff5a1f;--bd:#e3e3e8;--rd:#e5383b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#1b1b1f;--tx:#f2f2f2;--mu:#8e8e96;--bd:#2c2c32;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 160px}
h1{font-size:26px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
input[type=text],input[type=password],select{flex:1;min-width:0;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
select{width:100%;margin-top:6px}
input[type=text].mz{flex:1;width:auto;font-size:16px;padding:8px 10px}
input[type=text].nm{font-weight:700;font-size:17px;padding:8px 10px}
.gh{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:18px 4px 8px}.gh span{font-weight:500}
input[type=color]{width:56px;height:40px;border:1px solid var(--bd);border-radius:10px;background:none;padding:2px;flex:none}
#gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:12px;background:none;color:var(--mu);font-size:22px;padding:6px 10px;border-radius:8px;opacity:.7}
textarea{font-size:16px!important}
html,body{touch-action:manipulation}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:var(--on,#fff);font-weight:600}
button.g{background:transparent;color:var(--ac);padding:8px}
button.d{background:transparent;color:var(--rd);padding:8px}
button.big{width:100%;padding:16px;font-size:17px}
.name{font-weight:700;font-size:17px;flex:1;min-width:0;word-break:break-word}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.f label{font-size:12px;color:var(--mu);display:block;text-align:center}
.f input{width:100%;text-align:center;font-size:18px;font-weight:600;padding:10px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.mu{color:var(--mu);font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd)}
.item:last-of-type{border:0}
.item input{width:22px;height:22px;accent-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:8px 12px;border-radius:999px;font-weight:500}
.chip.on{background:var(--ac);color:var(--on,#fff);border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:16px 14px}
nav button.on{color:var(--ac)}
.link{cursor:pointer}
.sws{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.sw{width:40px;height:40px;border-radius:50%;border:0;padding:0;position:relative;display:block;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--tx)}
.sw input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0}
.ic{padding:8px 10px;line-height:0}
.sq{padding:12px;line-height:0}
.ib{display:inline-flex;align-items:center;gap:6px}
button,.card.link,.sw{transition:transform .12s ease,opacity .12s ease}
button:active,.sw:active{transform:scale(.93);opacity:.8}
.card.link:active{transform:scale(.985)}
.pg{animation:pgin .18s ease both}
.pg .card{animation:rise .3s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0)*35ms)}
.pg .tick{display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1) .25s both}
@keyframes pgin{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#wl{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;transition:opacity .35s ease;animation:pgin .3s ease both}
#wl .wi{font-size:64px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
#wl .wg{font-size:20px;color:var(--mu);margin-top:8px}
#wl .wn{font-size:38px;font-weight:800;color:var(--ac);word-break:break-word}
#wl .ws{margin-top:14px;font-size:17px}
#wl .wa{display:flex;gap:8px;margin-top:18px;width:100%;max-width:320px}
#wl .wh{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);color:var(--mu);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:8px 0;margin-bottom:6px}
input[type=date]{flex:1;min-width:0;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input.nt{flex:none;width:90px;font-size:16px;padding:12px 8px;text-align:center;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.hint{font-size:13px;font-weight:700;margin-top:8px}.hint:empty{display:none}.hint.up{color:var(--ac)}.hint.dn{color:var(--rd)}
.pb{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:10px}.pb i{display:block;height:100%;background:var(--ac)}.pb.over i{background:var(--rd)}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button id="t2" onclick="go('wo')">Treinos</button>
<button id="t1" onclick="go('ex')">Exercícios</button>
<button id="t3" onclick="go('tr')">Tracking</button>
</nav>
<button id="gear" onclick="openBk()" aria-label="Backup">⚙︎</button>
<script>
var S={ex:[],wo:[]};
try{var raw=localStorage.getItem('treino_v1');if(raw)S=JSON.parse(raw)}catch(e){}
S.wo.forEach(function(w){if(w.ids&&!w.slots){w.slots=w.ids.map(function(i){return{o:[i],s:i}});delete w.ids}});
fix();
var t0=0,lt=0,docRef=null,wt=null;try{t0=+localStorage.getItem('treino_t')||0}catch(e){}lt=t0;
function migSets(sp){(sp.wo||[]).forEach(function(w){(w.slots||[]).forEach(function(s){if(s.n===undefined){var e=(sp.ex||[]).find(function(x){return x.id===s.s})||(sp.ex||[]).find(function(x){return x.id===s.o[0]});s.n=e&&e.sets!=null?String(e.sets):''}})})}
function fix(){S.pr=S.pr||[];S.bw=S.bw||[];if(!S.cal||!S.cal.days)S.cal={goal:(S.cal&&S.cal.goal)||'',days:{}};if(S.last){var lw=getWo(S.last);if(lw&&!lw.done)lw.done=Date.now();S.last=''}S.wo.forEach(function(w){if(w.ids&&!w.slots){w.slots=w.ids.map(function(i){return{o:[i],s:i}});delete w.ids}if(!w.slots)w.slots=[]});migSets(S);if(S.alt)migSets(S.alt)}
function save(){lt=Date.now();try{localStorage.setItem('treino_v1',JSON.stringify(S));localStorage.setItem('treino_t',String(lt))}catch(e){}push()}
function push(){if(!docRef)return;clearTimeout(wt);wt=setTimeout(function(){docRef.set({json:JSON.stringify(S),t:lt}).catch(function(){})},500)}
var tab='wo',view=null,editId=null,draft=null,expW=true;
var arm=null;
function twice(k,m){if(arm===k){arm=null;return true}arm=k;toast(m);setTimeout(function(){if(arm===k)arm=null},5000);return false}
function toast(m){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:99;background:#111;color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:600';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},4000)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function go(t){tab=t;view=null;editId=null;render()}
function getEx(id){return S.ex.find(function(e){return e.id===id})}
function getWo(id){return S.wo.find(function(w){return w.id===id})}
function ic(p){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var I={trash:ic('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v5M14 11v5"/>'),plus:ic('<path d="M12 5v14M5 12h14"/>'),copy:ic('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>'),up:ic('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 20h14"/>'),down:ic('<path d="M12 4v12M7 11l5 5 5-5"/><path d="M5 20h14"/>')};
function fld(l,v,oc){return '<div><label>'+l+'</label><input type="number" inputmode="decimal" step="any" value="'+(v==null?'':esc(v))+'" onchange="'+oc+'"></div>'}
function updSets(wid,i,el){var w=getWo(wid);if(w&&w.slots[i]){var v=String(Math.max(0,Math.round(parseFloat(el.value)||0))||'');el.value=v;w.slots[i].n=v;save()}}
function card(e,showDel,sl){
  return '<div class="card">'+(showDel?'<input type="text" class="nm" style="width:100%" value="'+esc(e.name)+'" onchange="updN(\''+e.id+'\',this)"><div class="row" style="margin-top:8px"><input type="text" class="mz" placeholder="Músculo" value="'+esc(e.m||'')+'" onchange="updM(\''+e.id+'\',this)"><button class="d ic" aria-label="Apagar" onclick="delEx(\''+e.id+'\')">'+I.trash+'</button></div>':'<div class="row"><div class="name">'+esc(e.name)+'</div>'+(e.m?'<span class="mu">'+esc(e.m)+'</span>':'')+'</div>')+
  '<div class="f"'+(sl?'':' style="grid-template-columns:repeat(2,1fr)"')+'>'+fld('Peso (kg)',e.weight,'upd(\''+e.id+'\',\'weight\',this)')+(sl?fld('Séries',sl.n,'updSets(\''+sl.w+'\','+sl.i+',this)'):'')+fld('Reps',e.reps,'upd(\''+e.id+'\',\'reps\',this)')+'</div><div class="'+hintCls(e.reps)+'" data-h="'+e.id+'">'+hintTxt(e.reps)+'</div></div>';
}
function num1(v){v=String(v).replace(',','.').trim();if(v==='')return'';var n=parseFloat(v);return isNaN(n)?'':String(Math.round(n*10)/10)}
function hintTxt(r){var n=parseFloat(r);return(r===''||r==null||isNaN(n))?'':n>8?'↑ Aumenta o peso':n<6?'↓ Baixa o peso':''}
function hintCls(r){var n=parseFloat(r);return 'hint'+((r===''||r==null||isNaN(n))?'':n>8?' up':n<6?' dn':'')}
function upd(id,k,el){var e=getEx(id);if(!e)return;var v=num1(el.value);el.value=v;e[k]=v;save();if(k==='reps')document.querySelectorAll('[data-h="'+id+'"]').forEach(function(x){x.textContent=hintTxt(v);x.className=hintCls(v)})}
function updN(id,el){var e=getEx(id);if(!e)return;var v=el.value.trim();if(!v){el.value=e.name;return}e.name=v;save();var p=el.closest('.xi');if(p)p.setAttribute('data-n',(e.name+' '+(e.m||'')).toLowerCase())}
function exList(){var g={},keys=[];S.ex.forEach(function(e){var m=(e.m||'').trim(),k=m.toLowerCase();if(!g[k]){g[k]={l:m,a:[]};keys.push(k)}g[k].a.push(e)});
 keys.sort(function(a,b){if(a==='')return 1;if(b==='')return -1;return a.localeCompare(b,'pt')});
 return keys.map(function(k){var o=g[k];return '<div class="grp">'+(keys.length>1||k?'<div class="gh">'+esc(k?o.l:'Sem grupo muscular')+' <span>'+o.a.length+'</span></div>':'')+o.a.map(function(e){return '<div class="xi" id="x_'+e.id+'" data-n="'+esc((e.name+' '+(e.m||'')).toLowerCase())+'">'+card(e,true)+'</div>'}).join('')+'</div>'}).join('')}
function updM(id,el){var e=getEx(id);if(!e)return;var qi=document.getElementById('nn'),q=qi?qi.value:'';e.m=el.value.trim();save();render();var ni=document.getElementById('nn');if(ni&&q){ni.value=q;filt()}setTimeout(function(){var x=document.getElementById('x_'+id);if(x)x.scrollIntoView({behavior:'smooth',block:'center'})},60)}
function filt(){var i=document.getElementById('nn');if(!i)return;var q=i.value.trim().toLowerCase(),n=0;document.querySelectorAll('.xi').forEach(function(d){var m=!q||d.getAttribute('data-n').indexOf(q)>-1;d.style.display=m?'':'none';if(m)n++});document.querySelectorAll('.grp').forEach(function(g){var any=false;g.querySelectorAll('.xi').forEach(function(x){if(x.style.display!=='none')any=true});g.style.display=any?'':'none'});var r=document.getElementById('nores');if(r)r.style.display=(q&&!n&&S.ex.length)?'block':'none'}
function addEx(){var i=document.getElementById('nn'),n=i.value.trim();if(!n)return;var ne={id:uid(),name:n,m:'',weight:'',reps:'8'};S.ex.push(ne);save();render();setTimeout(function(){var el=document.getElementById('x_'+ne.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},60)}
function delEx(id){if(!twice('ex'+id,'Toca de novo em Apagar para confirmar'))return;S.ex=S.ex.filter(function(e){return e.id!==id});
  S.wo.forEach(function(w){w.slots.forEach(function(s){s.o=s.o.filter(function(x){return x!==id});if(s.s===id)s.s=s.o[0]});w.slots=w.slots.filter(function(s){return s.o.length})});save();render()}
function delWo(id){if(!twice('wo'+id,'Toca de novo em Apagar para confirmar'))return;S.wo=S.wo.filter(function(w){return w.id!==id});if(S.last===id)S.last='';view=null;save();render()}
function newWo(){draft={name:'',g:'',slots:[]};editId=null;view='edit';render()}
function editWo(id){draft=JSON.parse(JSON.stringify(getWo(id)));editId=id;view='edit';render()}
function addOpt(i,v){if(!v)return;draft.slots[i].o.push(v);render()}
function rmOpt(i,j){var s=draft.slots[i];s.o.splice(j,1);if(!s.o.length)draft.slots.splice(i,1);render()}
function rmSlot(i){draft.slots.splice(i,1);render()}
function addSlot(v){if(!v)return;draft.slots.push({o:[v],s:v,n:'2'});render()}
function saveWo(){
  var n=draft.name.trim();if(!n){toast('Dá um nome ao treino');return}
  draft.slots.forEach(function(s){if(s.o.indexOf(s.s)<0)s.s=s.o[0]});
  if(editId){var w=getWo(editId);w.name=n;w.slots=draft.slots;w.g=(draft.g||'').trim()}
  else{editId=uid();S.wo.push({id:editId,name:n,g:(draft.g||'').trim(),slots:draft.slots})}
  save();view=editId;render()
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function bkText(){return JSON.stringify({app:'treino',kind:'backup',v:3,theme:S.theme||null,last:S.last||'',name:S.name||'',space:S.space||'main',alt:S.alt||null,planV:S.planV||0,pr:S.pr||[],bw:S.bw||[],cal:S.cal||null,ex:S.ex,wo:S.wo})}
function bkCopy(){var t=document.getElementById('bt');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('Copiado! Cola nas Notas para guardar.')}
function bkShare(){if(navigator.share){navigator.share({text:bkText()}).catch(function(){})}else bkCopy()}
function pick(wid,i,id){getWo(wid).slots[i].s=id;save();render()}
var stab='bk';
function rgb(h){h=h.replace('#','');return[0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
function hx(c){return '#'+c.map(function(v){return ('0'+v.toString(16)).slice(-2)}).join('')}
function mix(a,b,t){return a.map(function(v,i){return Math.round(v+(b[i]-v)*t)})}
function lum(c){return(0.299*c[0]+0.587*c[1]+0.114*c[2])/255}
function rgb2hsl(c){var r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,h=0,sa=0;if(d){sa=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,sa,l]}
function hsl2rgb(h,sa,l){var a=sa*Math.min(l,1-l),f=function(n){var k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)].map(function(v){return Math.round(v*255)})}
function applyTheme(){var r=document.documentElement.style,t=S.theme||{};
 if(t.ac){var c=rgb(t.ac),q=rgb2hsl(c),sa=Math.min(q[1],1)*0.2,tx=hsl2rgb(q[0],Math.min(q[1],1)*0.35,0.95),b=hsl2rgb(q[0],sa,0.07);
  r.setProperty('--ac',t.ac);r.setProperty('--on',lum(c)>0.7?'#111':'#fff');r.setProperty('--bg',hx(b));r.setProperty('--card',hx(hsl2rgb(q[0],sa,0.045)));r.setProperty('--bd',hx(hsl2rgb(q[0],sa,0.14)));r.setProperty('--tx',hx(tx));r.setProperty('--mu',hx(hsl2rgb(q[0],Math.min(q[1],1)*0.25,0.62)));r.setProperty('color-scheme','dark')}
 else{['--ac','--on','--bg','--card','--bd','--tx','--mu','color-scheme'].forEach(function(n){r.removeProperty(n)})}}
function setTheme(k,v,fin){S.theme=S.theme||{};S.theme[k]=v;applyTheme();if(fin)save()}
function resetTheme(){S.theme=null;applyTheme();save();render();toast('Cores repostas')}
function stabs(){return '<div class="chips"><button class="chip'+(stab==='bk'?' on':'')+'" onclick="stab=\'bk\';render()">Backup</button><button class="chip'+(stab==='ap'?' on':'')+'" onclick="stab=\'ap\';render()">Aparência</button></div>'}
var PAL=[['#f97316','Laranja'],['#ef4444','Vermelho'],['#ec4899','Rosa'],['#a855f7','Roxo'],['#6366f1','Índigo'],['#3b82f6','Azul'],['#06b6d4','Ciano'],['#22c55e','Verde'],['#eab308','Amarelo']];
function pickAc(c){setTheme('ac',c,1);render()}
function apHtml(){var t=S.theme||{},ac=(t.ac||'').toLowerCase(),pr=PAL.filter(function(p){return p[0]===ac})[0],nm=!ac?'Original':(pr?pr[1]:'Personalizada');
 var sw='<button class="sw'+(!ac?' on':'')+'" style="background:#ff5a1f" aria-label="Original" onclick="resetTheme()"></button>'+PAL.map(function(p){return '<button class="sw'+(p[0]===ac?' on':'')+'" style="background:'+p[0]+'" aria-label="'+p[1]+'" onclick="pickAc(\''+p[0]+'\')"></button>'}).join('')+
 '<label class="sw'+(ac&&!pr?' on':'')+'" style="background:'+(ac&&!pr?ac:'conic-gradient(#ef4444,#eab308,#22c55e,#06b6d4,#6366f1,#ec4899,#ef4444)')+'"><input type="color" value="'+(ac||'#ff5a1f')+'" oninput="setTheme(\'ac\',this.value)" onchange="pickAc(this.value)"></label>';
 return '<div class="row"><button class="g" onclick="go(prevTab)">‹ Voltar</button></div><h1>Definições</h1>'+stabs()+
 '<div class="card"><div class="name">Cor de destaque</div><div class="mu" style="margin-top:4px">Cor atual: '+nm+'</div><div class="sws">'+sw+'</div><div class="mu" style="margin-top:14px">A cor principal da app. O fundo, as caixas e o texto ficam automaticamente numa versão mais escura e menos saturada dela. A roda de cores permite escolher qualquer outra.</div><button class="g" style="margin-top:8px;padding-left:0" onclick="resetTheme()">↺ Repor cor original</button></div>'+
 '<p class="mu">'+(docRef?'✓ A tua cor fica guardada na tua conta e incluída na cópia de segurança.':'A tua cor fica guardada neste telemóvel e incluída na cópia de segurança.')+'</p>'}

function sel(label,fn,excl){return '<select onchange="'+fn+'"><option value="">'+label+'</option>'+S.ex.filter(function(e){return excl.indexOf(e.id)<0}).map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>'}).join('')+'</select>'}

function render(){applyTheme();if(view&&view!=='edit'&&view!=='imp'&&view.indexOf('exp:')!==0&&!getWo(view))view=null;
  document.getElementById('t1').className=tab==='ex'?'on':'';
  document.getElementById('t2').className=tab==='wo'?'on':'';document.getElementById('t3').className=tab==='tr'?'on':'';
  var gb=document.getElementById('gear');if(gb)gb.style.display=(tab==='ex'||tab==='tr'||(tab==='wo'&&!view))?'':'none';
  var h='';
  if(tab==='bk'&&stab==='ap'){h=apHtml()}else if(tab==='bk'){
    var ta='width:100%;height:130px;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)';
    var bt=function(f,i,l){return '<button class="ib" onclick="'+f+'">'+i+' '+l+'</button>'};
    var cd=function(t,d,b){return '<div class="card"><div class="name">'+t+'</div><div class="mu" style="margin:6px 0 12px">'+d+'</div>'+b+'</div>'};
    h='<div class="row"><button class="g" onclick="go(prevTab)">‹ Voltar</button></div><h1>Definições</h1>'+stabs();
    if(pend){h+='<div class="card"><div class="name">'+(pend.k==='rs'?'Restaurar backup?':'Aplicar atualização?')+'</div><div class="mu" style="margin:6px 0 12px">'+(pend.k==='rs'?'Ficheiro lido: '+pend.d.ex.length+' exercício(s) e '+pend.d.wo.length+' treino(s). Isto substitui tudo o que tens agora na app.':'Atualização com '+pend.d.wo.length+' treino(s). O teu plano principal é atualizado; os teus pesos e reps mantêm-se e o espaço "Meu" não muda.')+'</div><div class="row" style="justify-content:space-between"><button class="g" onclick="pendNo()">Cancelar</button><button onclick="pendOk()">'+(pend.k==='rs'?'Restaurar':'Aplicar')+'</button></div></div>'}
    h+=cd('Guardar backup','Guarda tudo (exercícios, pesos, treinos, tracking e cores) num ficheiro no telemóvel.',bt('doBackup()',I.up,'Guardar ficheiro'));
    h+=cd('Restaurar backup','Repõe tudo a partir de um ficheiro de backup.',bt('pickRestore()',I.down,'Escolher ficheiro'));
    h+=cd('Receber atualização','Atualiza o plano principal com um ficheiro de atualização.',bt('pickUpdate()',I.down,'Escolher ficheiro'));
    if(IS_OWNER){
      h+=cd('Admin · criar atualização','Cria o ficheiro com o teu plano principal para enviares a quem usa a app (sem pesos).',bt('doUpdateFile()',I.up,'Criar ficheiro de atualização'));
      h+='<button class="g" onclick="lockAdm()">Bloquear admin</button>';
    }else{
      h+='<div class="card"><div class="row"><input type="password" id="pw" placeholder="Palavra-passe" autocomplete="off" onkeydown="if(event.key===\'Enter\')tryPw()"><button class="g" onclick="tryPw()">OK</button></div></div>';
    }
  }else if(tab==='tr'){h=trHtml()}else if(tab==='ex'){
    h='<h1>Exercícios</h1>'+spaceBar()+'<div class="card"><div class="row"><input type="text" id="nn" placeholder="Procurar nome/músculo ou adicionar" oninput="filt()" onkeydown="if(event.key===\'Enter\')addEx()"><button class="sq" aria-label="Adicionar" onclick="addEx()">'+I.plus+'</button></div></div>';
    h+=S.ex.length?exList()+'<p class="mu" id="nores" style="display:none">Nenhum exercício encontrado. Toca em Adicionar para o criar.</p>':'<p class="mu">Ainda não tens exercícios. Escreve o nome acima e adiciona.</p>';
  }else if(view==='edit'){
    h='<div class="bar"><button class="g" onclick="view='+(editId?'\''+editId+'\'':'null')+';render()">Sair sem guardar</button><button onclick="saveWo()">Guardar</button></div><h1>'+(editId?'Editar treino':'Novo treino')+'</h1><div class="card"><input type="text" id="wn" style="width:100%" placeholder="Nome (ex: Peito e Tríceps)" value="'+esc(draft.name)+'" oninput="draft.name=this.value"><input type="text" style="width:100%;margin-top:8px" list="gl" placeholder="Grupo (opcional: Upper, Lower…)" value="'+esc(draft.g||'')+'" oninput="draft.g=this.value"><datalist id="gl">'+wGroups().filter(function(g){return g.l}).map(function(g){return '<option value="'+esc(g.l)+'">'}).join('')+'</datalist></div>';
    draft.slots.forEach(function(s,i){
      h+='<div class="card"><div class="mu" style="margin-bottom:6px">'+(s.o.length>1?'Bloco '+(i+1)+' · escolhes 1 destas variações':'Bloco '+(i+1))+'</div><div class="row" style="margin-bottom:6px"><span class="mu">Séries do bloco</span><input type="number" inputmode="decimal" value="'+esc(s.n==null?'':s.n)+'" oninput="draft.slots['+i+'].n=this.value" style="width:80px;text-align:center;font-size:16px;font-weight:600;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"></div>';
      s.o.forEach(function(id,j){var e=getEx(id);h+='<div class="item"><span class="name" style="font-weight:600">'+esc(e?e.name:'?')+'</span><button class="d ic" aria-label="Remover" onclick="rmOpt('+i+','+j+')">'+I.trash+'</button></div>'});
      h+=sel('+ Adicionar variação…','addOpt('+i+',this.value)',usedIds())+'<div style="text-align:right;margin-top:6px"><button class="d ic" aria-label="Remover bloco" onclick="rmSlot('+i+')">'+I.trash+'</button></div></div>';
    });
    h+='<div class="card"><div class="mu">Novo bloco (um exercício do treino)</div>'+(S.ex.length?sel('+ Escolher exercício…','addSlot(this.value)',usedIds()):'<p class="mu">Primeiro adiciona exercícios no separador Exercícios.</p>')+'</div>';
  }else if(view==='imp'){
    h='<h1>Importar treino</h1><div class="card"><div class="mu">Cola aqui o código que te enviaram. Se já tiveres um treino com o mesmo nome, ele é atualizado: as séries seguem o plano, mas os teus pesos e reps não mudam.</div><textarea id="it" style="width:100%;height:180px;margin-top:8px;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)"></textarea></div><div class="row" style="justify-content:space-between"><button class="g" onclick="view=null;render()">Cancelar</button><button class="ib" onclick="importWo()">'+I.down+' Importar</button></div>';
  }else if(view&&view.indexOf('exp:')===0){
    var xid=view.slice(4);
    h='<div class="row"><button class="g" onclick="view=\''+xid+'\';render()">‹ Voltar</button></div><h1>Exportar treino</h1><div class="card"><label class="item"><input type="checkbox" '+(expW?'checked':'')+' onchange="expW=this.checked;render()"><span>Incluir pesos</span></label><div class="mu">Séries e repetições vão sempre incluídas.</div><textarea id="xt" readonly style="width:100%;height:220px;margin-top:10px;font-size:13px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)">'+esc(expText(xid))+'</textarea></div><div class="row"><button class="ib" onclick="shareExp()">'+I.up+' Partilhar</button><button class="g ib" onclick="copyExp()">'+I.copy+' Copiar</button></div>';
  }else if(view){
    var w2=getWo(view);
    h='<div class="row"><button class="g" onclick="view=null;render()">‹ Treinos</button><span style="flex:1"></span><button class="g ic" aria-label="Duplicar" onclick="dupWo(\''+w2.id+'\')">'+I.copy+'</button><button class="g" onclick="editWo(\''+w2.id+'\')">Editar</button><button class="d ic" aria-label="Apagar" onclick="delWo(\''+w2.id+'\')">'+I.trash+'</button></div>';
    h+='<h1>'+esc(w2.name)+'</h1>'+(w2.done?'<div class="row" style="margin-bottom:8px"><button class="g" style="padding-left:0" onclick="clrDone(\''+w2.id+'\')">Limpar marca</button></div>':'');
    var n=0;
    w2.slots.forEach(function(s,i){var e=getEx(s.s);if(!e)return;n++;
      if(s.o.length>1)h+='<div class="mu" style="margin:6px 2px">Variação (escolhe 1 · '+s.o.length+' opções):</div><select style="margin:0 0 8px;font-weight:600" onchange="pick(\''+w2.id+'\','+i+',this.value)">'+s.o.map(function(id){var x=getEx(id);return '<option value="'+id+'"'+(id===s.s?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select>';
      h+=card(e,false,{w:w2.id,i:i,n:s.n})});
    h+=n?'<p class="mu">As alterações guardam-se automaticamente e valem para todos os treinos com estes exercícios.</p>':'<p class="mu">Este treino não tem exercícios. Toca em Editar.</p>';
  }else{
    h='<h1>Treinos</h1>'+spaceBar()+lastHtml();
    h+=wList()+'<div style="border-top:1px solid var(--bd);margin:20px 0 16px"></div><div class="row"><button class="ib" onclick="newWo()">'+I.plus+' Novo treino</button></div>';
  }
  document.getElementById('app').innerHTML=h;animate();
}
function welcome(){
 var o=document.createElement('div');o.id='wl';
 var hr=new Date().getHours(),g=hr<6?'Boa noite':hr<12?'Bom dia':hr<20?'Boa tarde':'Boa noite';
 o.innerHTML='<div class="wi">🏋️</div><div class="wg"></div><div class="wn"></div><div class="ws"></div><div class="wa" style="display:none"><input type="text" id="wnm" placeholder="Como te chamas?" autocomplete="off"><button id="wok">Entrar</button></div><div class="wh">Toca para entrar</div>';
 document.body.appendChild(o);
 var q=function(c){return o.querySelector(c)},done=false,asking=false,t=null;
 function close(){if(done)return;done=true;clearTimeout(t);o.style.opacity='0';setTimeout(function(){o.remove()},380)}
 function setName(n){q('.wg').textContent=n?g+',':'Bem-vindo';q('.wn').textContent=n||''}
 function later(ms){clearTimeout(t);t=setTimeout(close,ms)}
 setName(S.name||'');
 var sg=null;try{sg=sugg()}catch(e){}
 q('.ws').textContent=sg?'Hoje: '+sg.name:'';
 o.onclick=function(){if(!asking)close()};
 later(3000);
 (async function(){var n='';
  n=String(n||'').trim().split(/\s+/)[0]||'';
  if(done)return;
  if(n){setName(n);later(2400);return}
  if(S.name){later(2400);return}
  if(!S.askedName){asking=true;clearTimeout(t);q('.wa').style.display='flex';q('.wh').style.display='none';
   var enter=function(){var v=q('#wnm').value.trim();S.name=v;S.askedName=true;save();asking=false;q('.wa').style.display='none';setName(v);later(1200)};
   q('#wok').onclick=enter;q('#wnm').onkeydown=function(e){if(e.key==='Enter')enter()}}
 })();
}
render();
welcome();
</script>
</body>
</html>
